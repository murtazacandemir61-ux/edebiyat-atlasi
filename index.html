<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İskendernâme - Klasik Türk Edebiyatı Coğrafi Atlası</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Leaflet Harita Kütüphanesi CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg-color: #0b0b0d;
            --panel-bg: rgba(28, 28, 30, 0.88);
            --card-bg: rgba(44, 44, 46, 0.65);
            --card-hover: rgba(58, 58, 60, 0.9);
            --accent-color: #f59e0b; /* Apple Altın/Kehribar */
            --text-primary: #f4f4f5;
            --text-secondary: #a1a1aa;
            --border-glass: rgba(255, 255, 255, 0.1);
            --app-font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --app-weight: 400;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: var(--app-font); 
            font-weight: var(--app-weight);
            background-color: var(--bg-color); 
            color: var(--text-primary); 
            display: flex; 
            height: 100vh; 
            width: 100vw;
            overflow: hidden; 
            position: relative; 
        }
        
        iframe[src*="netlify"], #netlify-badge, .netlify-badge, a[href*="netlify.com"] { 
            display: none !important; 
            visibility: hidden !important; 
            opacity: 0 !important; 
            pointer-events: none !important; 
        }

        /* Sol Panel */
        #sidebar { 
            width: 440px; 
            min-width: 440px;
            background: var(--panel-bg); 
            backdrop-filter: blur(30px); 
            -webkit-backdrop-filter: blur(30px);
            border-right: 1px solid var(--border-glass); 
            display: flex; 
            flex-direction: column; 
            z-index: 1000; 
            box-shadow: 20px 0 50px rgba(0,0,0,0.6);
        }
        .sidebar-header { 
            padding: 22px 24px; 
            border-bottom: 1px solid var(--border-glass); 
            background: rgba(28, 28, 30, 0.5); 
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .sidebar-header h1 { font-size: 1.1rem; font-weight: 600; color: var(--text-primary); letter-spacing: -0.01em; font-family: 'Playfair Display', serif; }
        
        .work-list { overflow-y: auto; flex: 1; padding: 16px; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.2) transparent; }
        .work-list::-webkit-scrollbar { width: 6px; }
        .work-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }

        /* Künye Kartı Tasarımı */
        .work-card { 
            background: var(--card-bg); 
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass);
            border-radius: 18px; 
            padding: 18px; 
            margin-bottom: 14px; 
            cursor: pointer; 
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1); 
            box-shadow: 0 4px 20px rgba(0,0,0,0.25);
        }
        .work-card:hover, .work-card.highlight { 
            background: var(--card-hover); 
            transform: translateY(-3px); 
            box-shadow: 0 8px 30px rgba(0,0,0,0.45);
            border-color: rgba(245, 158, 11, 0.6);
        }
        .work-card h3 { font-size: 1.2rem; color: #fff; margin-bottom: 4px; font-family: 'Playfair Display', serif; }
        .work-card .author { font-size: 0.9rem; color: var(--accent-color); font-style: italic; margin-bottom: 10px; }
        .work-card img { width: 100%; height: 140px; object-fit: cover; border-radius: 12px; margin: 8px 0 12px 0; display: block; border: 1px solid var(--border-glass); }
        
        /* Künye Detay Alanı */
        .kunye-section {
            background: rgba(0, 0, 0, 0.25);
            border-radius: 10px;
            padding: 10px 12px;
            margin-top: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .kunye-row {
            font-size: 0.8rem;
            color: #d4d4d8;
            margin-bottom: 6px;
            line-height: 1.4;
        }
        .kunye-row:last-child { margin-bottom: 0; }
        .kunye-label {
            color: var(--accent-color);
            font-weight: 600;
        }

        .active-badge {
            background: rgba(245, 158, 11, 0.2);
            color: var(--accent-color);
            font-size: 0.72rem;
            padding: 3px 8px;
            border-radius: 6px;
            float: right;
            border: 1px solid rgba(245, 158, 11, 0.4);
            font-weight: 500;
        }

        /* Harita Alanı */
        #map { flex-grow: 1; height: 100%; width: 100%; background-color: #0b0b0d; position: relative; }

        /* Popup Tasarımı */
        .leaflet-popup-content-wrapper, .leaflet-popup-tip {
            background: rgba(28, 28, 30, 0.96) !important;
            backdrop-filter: blur(25px) !important;
            color: #fff !important;
            border-radius: 16px !important;
            border: 1px solid var(--border-glass);
            box-shadow: 0 15px 40px rgba(0,0,0,0.7) !important;
        }
        .leaflet-popup-content { width: 260px !important; line-height: 1.5; }
        .leaflet-popup-content img { width: 100%; height: 130px; object-fit: cover; border-radius: 10px; margin: 8px 0; display: block; border: 1px solid var(--border-glass); }
        .leaflet-popup-content h4 { color: var(--accent-color); font-size: 0.95rem; margin-bottom: 4px; font-family: 'Playfair Display', serif; }
        .leaflet-popup-content p { font-size: 0.8rem; color: #d4d4d8; font-style: italic; margin-top: 6px; }
        .leaflet-container a.leaflet-popup-close-button {
            background: rgba(255, 255, 255, 0.15) !important;
            color: #fff !important;
            border-radius: 50% !important;
            width: 24px !important;
            height: 24px !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            top: 12px !important;
            right: 12px !important;
            font-size: 14px !important;
        }
        .leaflet-container a.leaflet-popup-close-button:hover { background: rgba(245, 158, 11, 0.8) !important; }

        /* Sağ Üst Kontroller */
        .top-controls { position: absolute; top: 20px; right: 24px; z-index: 2000; display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
        
        .pill-btn { 
            background: rgba(28, 28, 30, 0.88); 
            backdrop-filter: blur(20px); 
            color: var(--text-primary); 
            border: 1px solid var(--border-glass); 
            padding: 8px 16px; 
            height: 42px; 
            border-radius: 21px; 
            cursor: pointer; 
            font-size: 0.85rem; 
            font-weight: 500;
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 6px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4); 
            transition: all 0.2s; 
        }
        .pill-btn:hover { transform: scale(1.04); background: rgba(58, 58, 60, 0.95); border-color: var(--accent-color); }
        
        .dropdown-menu { 
            display: none; 
            position: absolute; 
            right: 0; 
            top: 52px; 
            background: rgba(28, 28, 30, 0.96); 
            backdrop-filter: blur(25px); 
            border: 1px solid var(--border-glass); 
            border-radius: 14px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.7); 
            width: 170px; 
            padding: 6px;
            z-index: 2500;
            max-height: 320px;
            overflow-y: auto;
        }
        .dropdown-menu.show { display: block; animation: fadeIn 0.2s ease; }

        /* Yazı Stili Menüsü */
        #font-style-menu {
            width: 320px;
            display: none;
            padding: 12px;
            gap: 10px;
        }
        #font-style-menu.show { display: flex !important; }
        .menu-column { flex: 1; display: flex; flex-direction: column; gap: 4px; }
        .menu-column-title {
            font-size: 0.72rem;
            color: var(--accent-color);
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 4px;
            letter-spacing: 0.05em;
            padding-left: 4px;
        }
        
        .dropdown-option { 
            padding: 8px 10px; 
            color: var(--text-primary); 
            background: none; 
            border: none; 
            width: 100%; 
            text-align: left; 
            cursor: pointer; 
            font-size: 0.83rem; 
            border-radius: 8px;
            transition: background 0.15s;
            font-weight: 500;
        }
        .dropdown-option:hover { background-color: rgba(245, 158, 11, 0.2); color: var(--accent-color); }
        .dropdown-option.active { background-color: rgba(245, 158, 11, 0.3); color: var(--accent-color); }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            #sidebar { width: 100%; min-width: 100%; height: 45vh; }
            #map { height: 55vh; }
        }
    </style>
</head>
<body>

    <!-- Sağ Üst Kontroller -->
    <div class="top-controls">
        <!-- Yazı Stili Butonu -->
        <div style="position: relative;" id="font-container">
            <button class="pill-btn" onclick="toggleFontMenu()" id="font-style-btn">🔤 Yazı Stili</button>
            <div id="font-style-menu" class="dropdown-menu">
                <div class="menu-column">
                    <div class="menu-column-title" id="lbl-font">Yazı Tipi</div>
                    <button class="dropdown-option font-opt active" onclick="setFontFamily('default', this)">Varsayılan</button>
                    <button class="dropdown-option font-opt" onclick="setFontFamily('roboto', this)">Roboto</button>
                    <button class="dropdown-option font-opt" onclick="setFontFamily('playfair', this)">Playfair</button>
                </div>
                <div class="menu-column">
                    <div class="menu-column-title" id="lbl-weight">Kalınlık</div>
                    <button class="dropdown-option weight-opt active" onclick="setFontWeight('400', this)">Normal</button>
                    <button class="dropdown-option weight-opt" onclick="setFontWeight('700', this)">Kalın</button>
                </div>
            </div>
        </div>

        <!-- Dil Seçici Butonu -->
        <div style="position: relative;" id="lang-container">
            <button class="pill-btn" onclick="toggleLangMenu()">🌐 Dil / Lang</button>
            <div id="lang-menu" class="dropdown-menu">
                <button class="dropdown-option" onclick="setLanguage('tr')">🇹🇷 Türkçe</button>
                <button class="dropdown-option" onclick="setLanguage('en')">🇬🇧 English</button>
                <button class="dropdown-option" onclick="setLanguage('fr')">🇫🇷 Français</button>
                <button class="dropdown-option" onclick="setLanguage('ar')">🇸🇦 العربية</button>
                <button class="dropdown-option" onclick="setLanguage('fa')">🇮🇷 فارسی</button>
                <button class="dropdown-option" onclick="setLanguage('zh')">🇨🇳 中文</button>
                <button class="dropdown-option" onclick="setLanguage('de')">🇩🇪 Deutsch</button>
                <button class="dropdown-option" onclick="setLanguage('el')">🇬🇷 Ελληνικά</button>
                <button class="dropdown-option" onclick="setLanguage('ja')">🇯🇵 日本語</button>
                <button class="dropdown-option" onclick="setLanguage('hi')">🇮🇳 हिन्दी</button>
            </div>
        </div>

        <!-- Sıfırlama Butonu -->
        <button class="pill-btn" onclick="resetMapToInitial()" title="İlk Konuma Dön">🔄 Sıfırla</button>
    </div>

    <div id="sidebar">
        <div class="sidebar-header">
            <h1 id="ui-title">İskendernâme Atlası</h1>
        </div>
        <div class="work-list" id="workList"></div>
    </div>

    <!-- Harita Alanı -->
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

                    { step: 28, title: "Nil Nehri", lat: 30.1000, lng: 31.3000, quote: "Nil nehrinin taşkın sularını ve suyunun gizemini ulemaya sordu.", image: "https://images.unsplash.com/photo-1512343879784-a960bf40e7f2?w=800" },
                    { step: 29, title: "İskenderiyye", lat: 31.2001, lng: 29.9187, quote: "Kendi adıyla anılan İskenderiye şehrini kurup fener inşa ettirdi.", image: "https://images.unsplash.com/photo-1539650116574-8efeb43e2750?w=800" },
                    { step: 30, title: "Mağrib", lat: 31.7917, lng: -7.0926, quote: "Mağrib diyarına, güneşin battığı en uzak batı sınırlarına kadar ulaştı.", image: "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=800" },
                    { step: 31, title: "Bağdat", lat: 33.3152, lng: 44.3661, quote: "Bağdat şehrinde Dicle kıyısında büyük bir medeniyet merkezi kurdu.", image: "https://images.unsplash.com/photo-1541432901042-2d8bd64b4a9b?w=800" },
                    { step: 32, title: "Hicaz & Kâbe", lat: 21.3891, lng: 39.8579, quote: "Hicaz topraklarına varıp Kâbe-i Muazzama'yı büyük bir tevazu ile ziyaret etti.", image: "https://images.unsplash.com/photo-1591604129939-f1efa4d9f7fa?w=800" },
                    { step: 33, title: "Mescid-i Aksa / Kudüs", lat: 31.7767, lng: 35.2345, quote: "Kudüs'e varıp Mescid-i Aksa'da ibadet edip hutbe okuttu.", image: "https://images.unsplash.com/photo-1577083552431-6e5fd01aa342?w=800" },
                    { step: 34, title: "Karanlıklar Diyarı (Zulmet)", lat: 65.0000, lng: 40.0000, quote: "Zulümat diyarına (Karanlıklar ülkesi) girip Âb-ı Hayat (ebedilik suyu) aradı.", image: "https://images.unsplash.com/photo-1509316975850-ff9c5deb0cd9?w=800" },
                    { step: 35, title: "Cadılar Diyarı", lat: 60.0000, lng: 50.0000, quote: "Cadılar ve sihirbazlar diyarından hikmetle ve selametle geçti.", image: "https://images.unsplash.com/photo-1524492412937-b28074a5d7da?w=800" }
                ]
            }
        ];

        const map = L.map('map', { 
            zoomControl: false,
            minZoom: 3,
            maxZoom: 16
        }).setView([38.9637, 35.2433], 4);

        L.control.zoom({ position: 'bottomright' }).addTo(map);

        // Standart Harita Katmanı (Sabit)
        let currentLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap' }).addTo(map);
        let activeMarkers = [];
        let activePolyline = null;
        let activeWorkId = null;

        function toggleFontMenu() {
            document.getElementById('font-style-menu').classList.toggle('show');
            document.getElementById('lang-menu').classList.remove('show');
        }

        function toggleLangMenu() {
            document.getElementById('lang-menu').classList.toggle('show');
            document.getElementById('font-style-menu').classList.remove('show');
        }

        window.addEventListener('click', function(e) {
            if (!document.getElementById('font-container').contains(e.target)) {
                document.getElementById('font-style-menu').classList.remove('show');
            }
            if (!document.getElementById('lang-container').contains(e.target)) {
                document.getElementById('lang-menu').classList.remove('show');
            }
        });

        function setLanguage(lang) {
            currentLang = lang;
            document.getElementById('lang-menu').classList.remove('show');
            renderApp();
        }

        function setFontFamily(fontKey, btnElement) {
            let fontValue = '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
            if (fontKey === 'roboto') fontValue = '"Roboto", sans-serif';
            if (fontKey === 'playfair') fontValue = '"Playfair Display", serif';

            document.documentElement.style.setProperty('--app-font', fontValue);
            document.querySelectorAll('.font-opt').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
        }

        function setFontWeight(weightValue, btnElement) {
            document.documentElement.style.setProperty('--app-weight', weightValue);
            document.querySelectorAll('.weight-opt').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
        }

        function resetMapToInitial() {
            clearMapElements();
            activeWorkId = null;
            map.setView([38.9637, 35.2433], 4);
            renderApp();
        }

        function clearMapElements() {
            activeMarkers.forEach(m => map.removeLayer(m));
            activeMarkers = [];
            if (activePolyline) {
                map.removeLayer(activePolyline);
                activePolyline = null;
            }
        }

        function selectWorkJourney(workId) {
            clearMapElements();
            activeWorkId = workId;
            renderApp();

            const work = classicalWorks.find(w => w.id === workId);
            if (!work) return;

            let latLngs = [];
            let boundsPoints = [];

            work.journey.forEach((stop, index) => {
                const point = [stop.lat, stop.lng];
                latLngs.push(point);
                boundsPoints.push(point);

                const numberedIcon = L.divIcon({
                    className: 'custom-numbered-pin',
                    html: `<div style="background: rgba(28, 28, 30, 0.95); backdrop-filter: blur(10px); border: 2px solid #f59e0b; color: #f59e0b; border-radius: 50%; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: bold; box-shadow: 0 4px 15px rgba(0,0,0,0.6);">${stop.step}</div>`,
                    iconSize: [34, 34],
                    iconAnchor: [17, 17],
                    popupAnchor: [0, -18]
                });

                const marker = L.marker(point, { icon: numberedIcon }).addTo(map);
                marker.bindPopup(`
                    <h4>Pim ${stop.step}: ${stop.title}</h4>
                    <img src="${stop.image}" alt="${stop.title}">
                    <p>"${stop.quote}"</p>
                `);

                activeMarkers.push(marker);
            });

            activePolyline = L.polyline(latLngs, {
                color: '#f59e0b',
                weight: 3,
                opacity: 0.85,
                dashArray: '5, 7',
                lineCap: 'round'
            }).addTo(map);

            if (boundsPoints.length > 0) {
                map.fitBounds(L.latLngBounds(boundsPoints), { padding: [50, 50], maxZoom: 8, animate: true });
            }
        }

        function renderApp() {
            document.getElementById('ui-title').innerText = uiTexts[currentLang].title;
            document.getElementById('font-style-btn').innerText = uiTexts[currentLang].fontStyle;
            document.getElementById('lbl-font').innerText = uiTexts[currentLang].fontTitle;
            document.getElementById('lbl-weight').innerText = uiTexts[currentLang].weightTitle;

            const workListContainer = document.getElementById('workList');
            workListContainer.innerHTML = '';

            classicalWorks.forEach(function(item) {
                const card = document.createElement('div');
                card.className = `work-card ${activeWorkId === item.id ? 'highlight' : ''}`;
                
                let activeBadgeHtml = activeWorkId === item.id ? '<span class="active-badge">Rotada Aktif (35 Durak)</span>' : '';

                card.innerHTML = `
                    ${activeBadgeHtml}
                    <h3>${item.title}</h3>
                    <div class="author">${item.author}</div>
                    <img src="${item.image}" alt="${item.title}">
                    <div class="kunye-section">
                        <div class="kunye-row"><span class="kunye-label">Dönem:</span> ${item.period}</div>
                        <div class="kunye-row"><span class="kunye-label">Merkez:</span> ${item.center}</div>
                        <div class="kunye-row"><span class="kunye-label">Edebi Tür:</span> ${item.form}</div>
                        <div class="kunye-row"><span class="kunye-label">Dili:</span> ${item.language}</div>
                        <div class="kunye-row"><span class="kunye-label">Yazılış Amacı:</span> ${item.purpose}</div>
                        <div class="kunye-row"><span class="kunye-label">Genel Konu:</span> ${item.subject}</div>
                    </div>
                `;

                card.addEventListener('click', function() {
                    selectWorkJourney(item.id);
                    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                });

                workListContainer.appendChild(card);
            });

            if (!activeWorkId && activeMarkers.length === 0) {
                classicalWorks.forEach(function(item) {
                    const initialIcon = L.divIcon({
                        className: 'custom-initial-pin',
                        html: `<div style="background: rgba(28, 28, 30, 0.9); backdrop-filter: blur(10px); border: 2px solid #f59e0b; color: #f59e0b; border-radius: 50%; width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; font-size: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.5);">📖</div>`,
                        iconSize: [42, 42],
                        iconAnchor: [21, 21],
                        popupAnchor: [0, -22]
                    });

                    const marker = L.marker([item.lat, item.lng], { icon: initialIcon }).addTo(map);
                    marker.bindPopup(`
                        <h4>${item.title}</h4>
                        <em>Yazar: ${item.author}</em>
                        <img src="${item.image}" alt="${item.title}">
                        <p><strong>Yazıldığı Merkez:</strong> ${item.center}<br><em>(35 Duraklı rotayı görmek için karta veya pime tıklayın)</em></p>
                    `);

                    marker.on('click', function() {
                        selectWorkJourney(item.id);
                    });

                    activeMarkers.push(marker);
                });
            }
        }

        renderApp();
    </script>
</body>
</html>
