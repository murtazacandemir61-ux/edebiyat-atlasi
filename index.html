<html lang="tr">

    <meta charset="UTF-8">

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Three.js ve Globe.gl 3D Küre Kütüphaneleri -->
    <script src="https://unpkg.com/three"></script>
    <script src="https://unpkg.com/globe.gl"></script>
    <style>
        :root {
            --bg-color: #050508;
            --panel-bg: rgba(28, 28, 30, 0.88);
            --card-bg: rgba(44, 44, 46, 0.65);
            --card-hover: rgba(58, 58, 60, 0.9);
            --accent-color: #f59e0b; /* Apple Altın/Kehribar */
            --text-primary: #f4f4f5;
            --text-secondary: #a1a1aa;
            --border-glass: rgba(255, 255, 255, 0.1);
            --app-font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --app-weight: 400;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: var(--app-font); 
            font-weight: var(--app-weight);
            background-color: var(--bg-color); 
            color: var(--text-primary); 
            display: flex; 
            height: 100vh; 
            width: 100vw;
            overflow: hidden; 
            position: relative; 
        }
        
        iframe[src*="netlify"], #netlify-badge, .netlify-badge, a[href*="netlify.com"] { 
            display: none !important; 
            visibility: hidden !important; 
            opacity: 0 !important; 
            pointer-events: none !important; 
        }

        /* Sol Panel */
        #sidebar { 
            width: 440px; 
            min-width: 440px;
            background: var(--panel-bg); 
            backdrop-filter: blur(30px); 
            -webkit-backdrop-filter: blur(30px);
            border-right: 1px solid var(--border-glass); 
            display: flex; 
            flex-direction: column; 
            z-index: 1000; 
            box-shadow: 20px 0 50px rgba(0,0,0,0.6);
        }
        .sidebar-header { 
            padding: 22px 24px; 
            border-bottom: 1px solid var(--border-glass); 
            background: rgba(28, 28, 30, 0.5); 
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .sidebar-header h1 { font-size: 1.1rem; font-weight: 600; color: var(--text-primary); letter-spacing: -0.01em; font-family: 'Playfair Display', serif; }
        
        .work-list { overflow-y: auto; flex: 1; padding: 16px; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.2) transparent; }
        .work-list::-webkit-scrollbar { width: 6px; }
        .work-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }

        /* Künye Kartı Tasarımı */
        .work-card { 
            background: var(--card-bg); 
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass);
            border-radius: 18px; 
            padding: 18px; 
            margin-bottom: 14px; 
            cursor: pointer; 
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1); 
            box-shadow: 0 4px 20px rgba(0,0,0,0.25);
        }
        .work-card:hover, .work-card.highlight { 
            background: var(--card-hover); 
            transform: translateY(-3px); 
            box-shadow: 0 8px 30px rgba(0,0,0,0.45);
            border-color: rgba(245, 158, 11, 0.6);
        }
        .work-card h3 { font-size: 1.2rem; color: #fff; margin-bottom: 4px; font-family: 'Playfair Display', serif; }
        .work-card .author { font-size: 0.9rem; color: var(--accent-color); font-style: italic; margin-bottom: 10px; }
        .work-card img { width: 100%; height: 140px; object-fit: cover; border-radius: 12px; margin: 8px 0 12px 0; display: block; border: 1px solid var(--border-glass); }
        
        .kunye-section {
            background: rgba(0, 0, 0, 0.25);
            border-radius: 10px;
            padding: 10px 12px;
            margin-top: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .kunye-row {
            font-size: 0.8rem;
            color: #d4d4d8;
            margin-bottom: 6px;
            line-height: 1.4;
        }
        .kunye-row:last-child { margin-bottom: 0; }
        .kunye-label {
            color: var(--accent-color);
            font-weight: 600;
        }

        .active-badge {
            background: rgba(245, 158, 11, 0.2);
            color: var(--accent-color);
            font-size: 0.72rem;
            padding: 3px 8px;
            border-radius: 6px;
            float: right;
            border: 1px solid rgba(245, 158, 11, 0.4);
            font-weight: 500;
        }

        /* 3D Küre ve Yıldızlı Uzay Alanı */
        #globeMap { 
            flex-grow: 1; 
            height: 100%; 
            width: 100%; 
            background: radial-gradient(circle at 50% 50%, #1e1b4b 0%, #0f172a 50%, #030712 100%) !important;
            position: relative; 
            overflow: hidden;
        }

        /* Yıldız Efekti Deseni */
        #globeMap::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                radial-gradient(white 1px, transparent 0),
                radial-gradient(rgba(255,255,255,0.6) 1.5px, transparent 0),
                radial-gradient(rgba(245,158,11,0.5) 2px, transparent 0);
            background-size: 120px 120px, 200px 200px, 300px 300px;
            background-position: 0 0, 40px 60px, 100px 150px;
            opacity: 0.45;
            pointer-events: none;
            z-index: 400;
        }

        /* Özel HTML Kart / Popup Tasarımı */
        .globe-popup {
            background: rgba(28, 28, 30, 0.96);
            backdrop-filter: blur(25px);
            color: #fff;
            padding: 14px;
            border-radius: 16px;
            border: 1px solid var(--border-glass);
            box-shadow: 0 15px 40px rgba(0,0,0,0.8);
            width: 260px;
            font-family: var(--app-font);
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2000;
            display: none;
        }
        .globe-popup img { width: 100%; height: 120px; object-fit: cover; border-radius: 10px; margin: 8px 0; border: 1px solid var(--border-glass); }
        .globe-popup h4 { color: var(--accent-color); font-size: 0.95rem; margin-bottom: 4px; font-family: 'Playfair Display', serif; }
        .globe-popup p { font-size: 0.78rem; color: #d4d4d8; font-style: italic; line-height: 1.4; }
        .globe-popup-close {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255,255,255,0.15);
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .globe-popup-close:hover { background: rgba(245, 158, 11, 0.8); }

        /* Sağ Üst Kontroller */
        .top-controls { position: absolute; top: 20px; right: 24px; z-index: 2000; display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
        
        .pill-btn { 
            background: rgba(28, 28, 30, 0.88); 
            backdrop-filter: blur(20px); 
            color: var(--text-primary); 
            border: 1px solid var(--border-glass); 
            padding: 8px 16px; 
            height: 42px; 
            border-radius: 21px; 
            cursor: pointer; 
            font-size: 0.85rem; 
            font-weight: 500;
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 6px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4); 
            transition: all 0.2s; 
        }
        .pill-btn:hover { transform: scale(1.04); background: rgba(58, 58, 60, 0.95); border-color: var(--accent-color); }
        
        .dropdown-menu { 
            display: none; 
            position: absolute; 
            right: 0; 
            top: 52px; 
            background: rgba(28, 28, 30, 0.96); 
            backdrop-filter: blur(25px); 
            border: 1px solid var(--border-glass); 
            border-radius: 14px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.7); 
            width: 180px; 
            padding: 6px;
            z-index: 2500;
            max-height: 320px;
            overflow-y: auto;
        }
        .dropdown-menu.show { display: block; animation: fadeIn 0.2s ease; }

        /* Yazı Stili ve Hız Menüleri */
        #font-style-menu { width: 320px; display: none; padding: 12px; gap: 10px; }
        #font-style-menu.show { display: flex !important; }
        .menu-column { flex: 1; display: flex; flex-direction: column; gap: 4px; }
        .menu-column-title {
            font-size: 0.72rem;
            color: var(--accent-color);
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 4px;
            letter-spacing: 0.05em;
            padding-left: 4px;
        }
        
        .dropdown-option { 
            padding: 8px 10px; 
            color: var(--text-primary); 
            background: none; 
            border: none; 
            width: 100%; 
            text-align: left; 
            cursor: pointer; 
            font-size: 0.83rem; 
            border-radius: 8px;
            transition: background 0.15s;
            font-weight: 500;
        }
        .dropdown-option:hover { background-color: rgba(245, 158, 11, 0.2); color: var(--accent-color); }
        .dropdown-option.active { background-color: rgba(245, 158, 11, 0.3); color: var(--accent-color); }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            #sidebar { width: 100%; min-width: 100%; height: 45vh; }
            #globeMap { height: 55vh; }
        }
    </style>
</head>

    <!-- Sağ Üst Kontroller -->
    <div class="top-controls">
        <!-- Hareket Hızı Butonu -->
        <div style="position: relative;" id="speed-container">
            <button class="pill-btn" onclick="toggleSpeedMenu()" id="speed-btn">⚡ Hız: 1x</button>
            <div id="speed-menu" class="dropdown-menu">
                <button class="dropdown-option speed-opt" onclick="setSpeed(0.25, '0.25x', this)">0.25x (Yavaş)</button>
                <button class="dropdown-option speed-opt" onclick="setSpeed(0.50, '0.50x', this)">0.50x</button>
                <button class="dropdown-option speed-opt" onclick="setSpeed(0.75, '0.75x', this)">0.75x</button>
                <button class="dropdown-option speed-opt active" onclick="setSpeed(1, '1x', this)">1x (Normal)</button>
                <button class="dropdown-option speed-opt" onclick="setSpeed(1.5, '1.5x', this)">1.5x</button>
                <button class="dropdown-option speed-opt" onclick="setSpeed(2, '2x', this)">2x (Hızlı)</button>
            </div>
        </div>

        <!-- Yazı Stili Butonu -->
        <div style="position: relative;" id="font-container">
            <button class="pill-btn" onclick="toggleFontMenu()" id="font-style-btn">🔤 Yazı Stili</button>
            <div id="font-style-menu" class="dropdown-menu">
                <div class="menu-column">
                    <div class="menu-column-title" id="lbl-font">Yazı Tipi</div>
                    <button class="dropdown-option font-opt active" onclick="setFontFamily('default', this)">Varsayılan</button>
                    <button class="dropdown-option font-opt" onclick="setFontFamily('roboto', this)">Roboto</button>
                    <button class="dropdown-option font-opt" onclick="setFontFamily('playfair', this)">Playfair</button>
                </div>
                <div class="menu-column">
                    <div class="menu-column-title" id="lbl-weight">Kalınlık</div>
                    <button class="dropdown-option weight-opt active" onclick="setFontWeight('400', this)">Normal</button>
                    <button class="dropdown-option weight-opt" onclick="setFontWeight('700', this)">Kalın</button>
                </div>
            </div>
        </div>

        <!-- Dil Seçici Butonu -->
        <div style="position: relative;" id="lang-container">
            <button class="pill-btn" onclick="toggleLangMenu()">🌐 Dil / Lang</button>
            <div id="lang-menu" class="dropdown-menu">
                <button class="dropdown-option" onclick="setLanguage('tr')">🇹🇷 Türkçe</button>
                <button class="dropdown-option" onclick="setLanguage('en')">🇬🇧 English</button>
                <button class="dropdown-option" onclick="setLanguage('fr')">🇫🇷 Français</button>
                <button class="dropdown-option" onclick="setLanguage('ar')">🇸🇦 العربية</button>
                <button class="dropdown-option" onclick="setLanguage('fa')">🇮🇷 فارسی</button>
                <button class="dropdown-option" onclick="setLanguage('zh')">🇨🇳 中文</button>
                <button class="dropdown-option" onclick="setLanguage('de')">🇩🇪 Deutsch</button>
                <button class="dropdown-option" onclick="setLanguage('el')">🇬🇷 Ελληνικά</button>
                <button class="dropdown-option" onclick="setLanguage('ja')">🇯🇵 日本語</button>
                <button class="dropdown-option" onclick="setLanguage('hi')">🇮🇳 हिन्दी</button>
            </div>
        </div>

        <!-- Sıfırlama Butonu -->
        <button class="pill-btn" onclick="resetGlobeToInitial()" title="İlk Konuma Dön">🔄 Sıfırla</button>
    </div>

    <div id="sidebar">
        <div class="sidebar-header">
            <h1 id="ui-title">İskendernâme Atlası</h1>
        </div>
        <div class="work-list" id="workList"></div>
    </div>

    <!-- 3D Küre Alanı -->
    <div id="globeMap">
        <div id="globePopup" class="globe-popup">
            <button class="globe-popup-close" onclick="closeGlobePopup()">✕</button>
            <h4 id="popupTitle"></h4>
            <img id="popupImg" src="" alt="">
            <p id="popupQuote"></p>
        </div>

            (container)
            .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-night.jpg')
            .bumpImageUrl('https://unpkg.com/three-globe/example/img/earth-topology.png')

        function setSpeed(multiplier, labelText, btnElement) {

        function setFontFamily(fontKey, btnElement) {

            if (fontKey === 'roboto') fontValue = '"Roboto", sans-serif';
            if (fontKey === 'playfair') fontValue = '"Playfair Display", serif';

            document.documentElement.style.setProperty('--app-font', fontValue);
            document.querySelectorAll('.font-opt').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
        }

            document.documentElement.style.setProperty('--app-weight', weightValue);

        }

        function resetGlobeToInitial() {
            if (vehicleAnimationTimer) clearInterval(vehicleAnimationTimer);
            activeWorkId = null;
            globe.pointsData([]).arcsData([]).customLayerData([]);
            globe.pointOfView({ lat: 38.9637, lng: 35.2433, altitude: 3.2 }, 1000);
            closeGlobePopup();
            renderApp();
        }

        function closeGlobePopup() {
            document.getElementById('globePopup').style.display = 'none';
        }

        function selectWorkJourney(workId) {
            activeWorkId = workId;
            renderApp();

            const work = classicalWorks.find(w => w.id === workId);
            if (!work) return;

            const points = work.journey.map(stop => ({
                lat: stop.lat,
                lng: stop.lng,
                size: 0.8,
                color: '#f59e0b',
                title: `Pim ${stop.step}: ${stop.title}`,
                quote: stop.quote,
                image: stop.image
            }));

            points.push({
                lat: work.lat,
                lng: work.lng,
                size: 1.2,
                color: '#3b82f6',
                title: work.title,
                quote: work.author,
                image: work.image
            });

            globe.pointsData(points)
                .pointAltitude(0.02)
                .pointColor('color')
                .pointRadius('size')
                .pointLabel(d => d.title)
                .onPointClick(d => {
                    document.getElementById('popupTitle').innerText = d.title;
                    document.getElementById('popupImg').src = d.image;
                    document.getElementById('popupQuote').innerText = `"${d.quote}"`;
                    document.getElementById('globePopup').style.display = 'block';
                    globe.pointOfView({ lat: d.lat, lng: d.lng, altitude: 2.0 }, 1000);
                });

            const arcs = [];
            for (let i = 0; i < work.journey.length - 1; i++) {
                arcs.push({
                    startLat: work.journey[i].lat,
                    startLng: work.journey[i].lng,
                    endLat: work.journey[i+1].lat,
                    endLng: work.journey[i+1].lng,
                    color: ['#f59e0b', '#fbbf24']
                });
            }

            globe.arcsData(arcs)
                .arcColor('color')
                .arcDashLength(0.4)
                .arcDashGap(0.2)
                .arcDashInitialGap(() => Math.random())
                .arcDashAnimateTime(2000);

            globe.pointOfView({ lat: 25.0, lng: 55.0, altitude: 3.0 }, 1500);

            startGlobeVehicleAnimation(work.journey);
        }

        function startGlobeVehicleAnimation(journey) {
            if (vehicleAnimationTimer) clearInterval(vehicleAnimationTimer);

            let segment = 0;
            let progress = 0;
            const totalSteps = 50;

            vehicleAnimationTimer = setInterval(() => {
                if (segment >= journey.length - 1) {
                    segment = 0;
                }

                let p1 = journey[segment];
                let p2 = journey[segment + 1];

                let curLat = p1.lat + (p2.lat - p1.lat) * (progress / totalSteps);
                let curLng = p1.lng + (p2.lng - p1.lng) * (progress / totalSteps);

                let transportEmoji = p2.transport === 'ship' ? '🚢' : '🚗';

                globe.customLayerData([{
                    lat: curLat,
                    lng: curLng,
                    emoji: transportEmoji
                }])
                .customThreeObject(d => {
                    const canvas = document.createElement('canvas');
                    canvas.width = 64;
                    canvas.height = 64;
                    const ctx = canvas.getContext('2d');
                    ctx.font = '40px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(d.emoji, 32, 32);

                    const texture = new THREE.CanvasTexture(canvas);
                    const material = new THREE.SpriteMaterial({ map: texture });
                    const sprite = new THREE.Sprite(material);
                    sprite.scale.set(10, 10, 1);
                    return sprite;
                });

                progress++;
                if (progress > totalSteps) {
                    progress = 0;
                    segment++;
                }
            }, 80 / animationSpeedMultiplier);
        }

        function renderApp() {
            const t = translations[currentLang];

            document.getElementById('ui-title').innerText = t.title;
            document.getElementById('font-style-btn').innerText = t.fontStyle;
            document.getElementById('lbl-font').innerText = t.fontTitle;
            document.getElementById('lbl-weight').innerText = t.weightTitle;

            const workListContainer = document.getElementById('workList');
            workListContainer.innerHTML = '';

            classicalWorks.forEach(function(item) {
                const card = document.createElement('div');
                card.className = `work-card ${activeWorkId === item.id ? 'highlight' : ''}`;
                
                let activeBadgeHtml = activeWorkId === item.id ? `<span class="active-badge">${t.activeRoute}</span>` : '';

                card.innerHTML = `
                    ${activeBadgeHtml}
                    <h3>${t.workTitle}</h3>
                    <div class="author">${t.author}</div>
                    <img src="${item.image}" alt="${t.workTitle}">
                    <div class="kunye-section">
                        <div class="kunye-row"><span class="kunye-label">${t.period}:</span> ${t.workPeriod}</div>
                        <div class="kunye-row"><span class="kunye-label">${t.center}:</span> ${t.workCenter}</div>
                        <div class="kunye-row"><span class="kunye-label">${t.form}:</span> ${t.workForm}</div>
                        <div class="kunye-row"><span class="kunye-label">${t.lang}:</span> ${t.workLang}</div>
                        <div class="kunye-row"><span class="kunye-label">${t.purpose}:</span> ${t.workPurpose}</div>
                        <div class="kunye-row"><span class="kunye-label">${t.subject}:</span> ${t.workSubject}</div>
                    </div>
                `;

                card.addEventListener('click', function() {
                    selectWorkJourney(item.id);
                    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                });

                workListContainer.appendChild(card);
            });
        }

        renderApp();
