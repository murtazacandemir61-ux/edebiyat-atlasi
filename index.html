<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>İskendernâme - Klasik Türk Edebiyatı Coğrafi Atlası</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg-color:#0b0b0d;--panel-bg:rgba(28,28,30,.88);--card-bg:rgba(44,44,46,.65);--card-hover:rgba(58,58,60,.9);--accent-color:#f59e0b;--cyan:#38e1ff;--text-primary:#f4f4f5;--text-secondary:#a1a1aa;--border-glass:rgba(255,255,255,.1);--app-font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;--app-weight:400}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--app-font);font-weight:var(--app-weight);background:var(--bg-color);color:var(--text-primary);display:flex;height:100vh;width:100vw;overflow:hidden;position:relative}
iframe[src*="netlify"],#netlify-badge,.netlify-badge,a[href*="netlify.com"]{display:none!important}

#sidebar{width:440px;min-width:440px;background:var(--panel-bg);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border-right:1px solid var(--border-glass);display:flex;flex-direction:column;z-index:1000;box-shadow:20px 0 50px rgba(0,0,0,.6)}
.sidebar-header{padding:22px 24px;border-bottom:1px solid var(--border-glass);background:rgba(28,28,30,.5)}
.sidebar-header h1{font-size:1.1rem;font-weight:600;letter-spacing:-.01em;font-family:'Playfair Display',serif}
.work-list{overflow-y:auto;flex:1;padding:16px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.2) transparent}
.work-card{background:var(--card-bg);backdrop-filter:blur(12px);border:1px solid var(--border-glass);border-radius:18px;padding:18px;margin-bottom:14px;cursor:pointer;transition:all .3s cubic-bezier(.25,1,.5,1);box-shadow:0 4px 20px rgba(0,0,0,.25)}
.work-card:hover,.work-card.highlight{background:var(--card-hover);transform:translateY(-3px);box-shadow:0 8px 30px rgba(0,0,0,.45);border-color:rgba(245,158,11,.6)}
.work-card h3{font-size:1.2rem;color:#fff;margin-bottom:4px;font-family:'Playfair Display',serif}
.work-card .author{font-size:.9rem;color:var(--accent-color);font-style:italic;margin-bottom:10px}
.work-card img{width:100%;height:140px;object-fit:cover;border-radius:12px;margin:8px 0 12px;display:block;border:1px solid var(--border-glass)}
.kunye-section{background:rgba(0,0,0,.25);border-radius:10px;padding:10px 12px;margin-top:10px;border:1px solid rgba(255,255,255,.05)}
.kunye-row{font-size:.8rem;color:#d4d4d8;margin-bottom:6px;line-height:1.4}
.kunye-row:last-child{margin-bottom:0}
.kunye-label{color:var(--accent-color);font-weight:600}
.active-badge{background:rgba(245,158,11,.2);color:var(--accent-color);font-size:.72rem;padding:3px 8px;border-radius:6px;float:right;border:1px solid rgba(245,158,11,.4);font-weight:500}

/* Küre alanı */
#stage{flex-grow:1;height:100%;position:relative;overflow:hidden;background:radial-gradient(ellipse at 55% 45%,#0c2250 0%,#06122e 50%,#02050f 100%)}
#stars{position:absolute;inset:0;width:100%;height:100%;z-index:0}
#globe{position:absolute;inset:0;z-index:1}
#globe canvas{outline:none}

/* Pimler */
.pinw{width:0;height:0}
.pin{position:absolute;left:-16px;top:-16px;width:32px;height:32px;pointer-events:auto;cursor:pointer;transition:opacity .25s;animation:pop .5s cubic-bezier(.2,1.4,.4,1) both}
.pin.hid{opacity:0;pointer-events:none}
.pin b{display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;background:rgba(8,16,36,.9);border:2px solid var(--accent-color);color:var(--accent-color);font-size:12px;font-weight:700;box-shadow:0 0 14px rgba(245,158,11,.55),0 4px 14px rgba(0,0,0,.6);transition:transform .2s,background .2s}
.pin:hover b,.pin.cur b{transform:scale(1.2);background:var(--accent-color);color:#0b0b0d}
.pin.cur b{box-shadow:0 0 22px rgba(245,158,11,.95)}
.pin.start b{width:42px;height:42px;font-size:18px;margin:-5px;animation:pulse 2s infinite}
.pin i{position:absolute;top:36px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.78);color:var(--accent-color);border:1px solid rgba(245,158,11,.3);padding:2px 6px;border-radius:4px;font-size:11px;font-weight:600;font-style:normal;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .2s}
.pin:hover i,.pin.cur i,.zoomed .pin i{opacity:1}
.pin:hover{z-index:10}
@keyframes pop{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(245,158,11,.6)}50%{box-shadow:0 0 0 12px rgba(245,158,11,0)}}

/* Bilgi kartı */
#popup{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);width:290px;z-index:1500;display:none;background:rgba(10,18,40,.92);backdrop-filter:blur(25px);-webkit-backdrop-filter:blur(25px);color:#fff;border-radius:16px;border:1px solid rgba(56,225,255,.3);box-shadow:0 15px 40px rgba(0,0,0,.7),0 0 30px rgba(56,225,255,.12);padding:14px}
#popup.show{display:block;animation:fadeIn .25s ease}
#popup h4{color:var(--accent-color);font-size:.95rem;margin-bottom:4px;font-family:'Playfair Display',serif;padding-right:26px}
#popup img{width:100%;height:130px;object-fit:cover;border-radius:10px;margin:8px 0;display:block;border:1px solid var(--border-glass)}
#popup p{font-size:.8rem;color:#d4d4d8;font-style:italic;line-height:1.5}
#popup-close{position:absolute;top:10px;right:10px;width:24px;height:24px;border-radius:50%;border:none;background:rgba(255,255,255,.15);color:#fff;cursor:pointer;font-size:13px}
#popup-close:hover{background:rgba(245,158,11,.8)}

/* Kontroller */
.top-controls{position:absolute;top:20px;right:24px;z-index:2000;display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.pill-btn{background:rgba(28,28,30,.88);backdrop-filter:blur(20px);color:var(--text-primary);border:1px solid var(--border-glass);padding:8px 16px;height:42px;border-radius:21px;cursor:pointer;font-size:.85rem;font-weight:500;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:6px;box-shadow:0 8px 25px rgba(0,0,0,.4);transition:all .2s}
.pill-btn:hover{transform:scale(1.04);background:rgba(58,58,60,.95);border-color:var(--accent-color)}
.dropdown-menu{display:none;position:absolute;right:0;top:52px;background:rgba(28,28,30,.96);backdrop-filter:blur(25px);border:1px solid var(--border-glass);border-radius:14px;box-shadow:0 15px 35px rgba(0,0,0,.7);width:180px;padding:6px;z-index:2500;max-height:320px;overflow-y:auto}
.dropdown-menu.show{display:block;animation:fadeIn .2s ease}
#font-style-menu{width:320px;padding:12px;gap:10px}
#font-style-menu.show{display:flex!important}
.menu-column{flex:1;display:flex;flex-direction:column;gap:4px}
.menu-column-title{font-size:.72rem;color:var(--accent-color);font-weight:600;text-transform:uppercase;margin-bottom:4px;letter-spacing:.05em;padding-left:4px}
.dropdown-option{padding:8px 10px;color:var(--text-primary);background:none;border:none;width:100%;text-align:left;cursor:pointer;font-size:.83rem;border-radius:8px;transition:background .15s;font-weight:500;font-family:inherit}
.dropdown-option:hover{background:rgba(245,158,11,.2);color:var(--accent-color)}
.dropdown-option.active{background:rgba(245,158,11,.3);color:var(--accent-color)}
@keyframes fadeIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:768px){body{flex-direction:column}#sidebar{width:100%;min-width:100%;height:45vh}#stage{height:55vh}}
</style>

// Küre dokusu: sırayla birkaç adresi dener; hiçbiri olmazsa küre yine de mavi görünür
const TEX=['https://unpkg.com/three-globe/example/img/earth-night.jpg','https://cdn.jsdelivr.net/npm/three-globe/example/img/earth-night.jpg','https://raw.githubusercontent.com/vasturiano/three-globe/master/example/img/earth-night.jpg'];
(function loadTex(i){
  if(i>=TEX.length){const m=globe.globeMaterial();m.color.set('#12357a');if(m.emissive)m.emissive.set('#081a3d');return}
  const im=new Image();im.crossOrigin='anonymous';
  im.onload=()=>globe.globeImageUrl(TEX[i]);
  im.onerror=()=>loadTex(i+1);
  im.src=TEX[i];
})(0);

const ctl=globe.controls();
ctl.minDistance=115;ctl.maxDistance=450;ctl.zoomSpeed=0.7;ctl.enablePan=false;ctl.enableDamping=true;

function fit(){globe.width(gEl.clientWidth).height(gEl.clientHeight);drawStars()}

// Yıldızlı arka plan
function drawStars(){
  const c=document.getElementById('stars'),r=devicePixelRatio||1;
  c.width=c.clientWidth*r;c.height=c.clientHeight*r;
  const x=c.getContext('2d');x.scale(r,r);
  let s=7;const rnd=()=>(s=(s*16807)%2147483647)/2147483647;
  for(let i=0;i<420;i++){
    const rad=rnd()*1.3+.2,a=rnd()*.7+.25;
    x.fillStyle=rnd()>.8?`rgba(160,200,255,${a})`:`rgba(255,255,255,${a})`;
    x.beginPath();x.arc(rnd()*c.clientWidth,rnd()*c.clientHeight,rad,0,7);x.fill();
  }
}

// Ülke sınırları + ülke adları
let countryLabels=[];
function bboxCenter(f){
  const g=f.geometry,polys=g.type==='Polygon'?[g.coordinates]:g.coordinates;let best=null,ba=-1;
  polys.forEach(p=>{let a=1e9,b=-1e9,c=1e9,d=-1e9;p[0].forEach(([x,y])=>{a=Math.min(a,x);b=Math.max(b,x);c=Math.min(c,y);d=Math.max(d,y)});
    const ar=(b-a)*(d-c);if(ar>ba){ba=ar;best=[(c+d)/2,(a+b)/2,ar]}});
  return best;
}
(async function loadBorders(){
  const urls=['https://cdn.jsdelivr.net/gh/vasturiano/globe.gl@master/example/datasets/ne_110m_admin_0_countries.geojson','https://raw.githubusercontent.com/vasturiano/globe.gl/master/example/datasets/ne_110m_admin_0_countries.geojson'];
  for(const u of urls){
    try{
      const j=await (await fetch(u)).json();
      globe.polygonsData(j.features);
      countryLabels=j.features.map(f=>{const c=bboxCenter(f);const p=f.properties;return c&&{name:p.NAME||p.ADMIN||p.name,lat:c[0],lng:c[1],area:c[2]}}).filter(Boolean);
      applyLabels(true);return;
    }catch(e){}
  }
})();

// Yakınlığa göre ayrıntı düzeyi
let lastLevel=-1;
const level=a=>a>1.7?0:a>0.8?1:2;
function applyLabels(force){
  const l=level(globe.pointOfView().altitude);
  if(l===lastLevel&&!force)return;lastLevel=l;
  const o=[];
  const add=(arr,size,col)=>arr.forEach(a=>o.push({name:a[0],lat:a[1],lng:a[2],size,col}));
  if(l===0){add(CONT,2.3,'#e2e8f0');add(OCEAN,1.8,'#7dd3fc')}
  if(l===1){add(OCEAN,1.1,'#7dd3fc');add(SEAS,0.6,'#7dd3fc');
    countryLabels.filter(c=>c.area>60).forEach(c=>o.push({name:c.name,lat:c.lat,lng:c.lng,size:0.6,col:'rgba(226,232,240,.88)'}))}
  if(l===2){add(OCEAN,0.8,'#7dd3fc');add(SEAS,0.4,'#7dd3fc');
    countryLabels.forEach(c=>o.push({name:c.name,lat:c.lat,lng:c.lng,size:0.32,col:'rgba(226,232,240,.88)'}));
    add(CITIES,0.2,'#fde68a')}
  globe.labelsData(o);
}
globe.onZoom(p=>{gEl.classList.toggle('zoomed',p.altitude<1.1);applyLabels()});

/* ================= PİMLER ================= */
let pins=[];
function mkPin(d){
  const w=document.createElement('div');w.className='pinw';
  const p=document.createElement('div');p.className='pin'+(d.start?' start':'');
  p.innerHTML=d.start?'<b>📖</b>':`<b>${d.step}</b><i>${d.title}</i>`;
  if(!d.start)p.style.animationDelay=(d.step*40)+'ms';
  p.onclick=e=>{e.stopPropagation();d.start?startTour():openStop(d)};
  w.appendChild(p);d.pin=p;return w;
}
function setPins(arr){
  pins=arr;globe.htmlElementsData(arr);
  arr.forEach(d=>d.xyz=globe.getCoords(d.lat,d.lng,0));
}
// Küre arkasında kalan pimleri gizle
(function loop(){
  const c=globe.camera().position;
  pins.forEach(d=>{if(d.pin&&d.xyz)d.pin.classList.toggle('hid',d.xyz.x*c.x+d.xyz.y*c.y+d.xyz.z*c.z<10000)});
  requestAnimationFrame(loop);
})();
function markCurrent(d){pins.forEach(p=>p.pin&&p.pin.classList.toggle('cur',p===d))}

function openStop(d){
  popupOpen=true;
  document.getElementById('popup-body').innerHTML=`<h4>Pim ${d.step}: ${d.title}</h4><img src="${d.image}" alt="${d.title}" referrerpolicy="no-referrer" onerror="this.onerror=null;this.src=FALLBACK"><p>"${d.quote}"</p>`;
  document.getElementById('popup').classList.add('show');
  globe.pointOfView({lat:d.lat,lng:d.lng,altitude:1.1},1000);
}
function closePopup(){popupOpen=false;document.getElementById('popup').classList.remove('show')}

/* ================= ROTA ANİMASYONU ================= */
const R=Math.PI/180;
const toV=(la,lo)=>[Math.cos(la*R)*Math.cos(lo*R),Math.cos(la*R)*Math.sin(lo*R),Math.sin(la*R)];
function greatCircle(a,b,n){
  const A=toV(a.lat,a.lng),B=toV(b.lat,b.lng);
  const d=Math.acos(Math.max(-1,Math.min(1,A[0]*B[0]+A[1]*B[1]+A[2]*B[2])));
  const pts=[];
  for(let i=0;i<=n;i++){
    const t=i/n;let v=A;
    if(d>1e-6){const s=Math.sin(d),w1=Math.sin((1-t)*d)/s,w2=Math.sin(t*d)/s;v=[0,1,2].map(k=>w1*A[k]+w2*B[k])}
    pts.push([Math.asin(Math.max(-1,Math.min(1,v[2])))/R,Math.atan2(v[1],v[0])/R,0.012+0.07*Math.sin(Math.PI*t)*d/Math.PI]);
  }
  return{pts,deg:d/R};
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
function anim(ms,fn,id){
  return new Promise(res=>{
    const t0=performance.now();
    (function f(n){
      if(id!==runId)return res();
      const t=Math.min(1,(n-t0)/ms);fn(t);
      t<1?requestAnimationFrame(f):res();
    })(t0);
  });
}
function clearRoute(){globe.pathsData([]).pointsData([]).ringsData([]);markCurrent(null)}
const pair=(pts)=>[{pts,g:1},{pts,g:0}];

async function runTour(id){
  while(id===runId){
    const done=[];clearRoute();
    for(let i=0;i<STOPS.length-1&&id===runId;i++){
      const a=STOPS[i],b=STOPS[i+1],gc=greatCircle(a,b,48);
      const ms=Math.max(1100,Math.min(3600,900+gc.deg*28))/speed;
      markCurrent(a);
      if(!popupOpen){
        const m=gc.pts[24];
        globe.pointOfView({lat:m[0],lng:m[1],altitude:Math.max(1.3,Math.min(2.6,1.2+gc.deg/45))},900/speed);
      }
      await anim(ms,t=>{
        const k=Math.max(1,Math.round(ease(t)*48)),part=gc.pts.slice(0,k+1),h=part[part.length-1];
        globe.pathsData([...done.flatMap(pair),...pair(part)]);
        globe.pointsData([{lat:h[0],lng:h[1],alt:h[2]}]);
      },id);
      if(id!==runId)return;
      done.push(gc.pts);
      globe.pathsData(done.flatMap(pair));
      globe.ringsData([b]);markCurrent(b);
      await sleep(350/speed);
    }
    if(id!==runId)return;
    globe.pointsData([]);
    await sleep(3000/speed);
  }
}
function startTour(){
  runId++;const id=runId;
  activeWorkId=WORK.id;closePopup();
  setPins(STOPS);
  gEl.classList.remove('zoomed');
  globe.pointOfView({lat:STOPS[0].lat,lng:STOPS[0].lng,altitude:2.2},1000);
  renderCard();
  setTimeout(()=>{if(id===runId)runTour(id)},900);
}
function resetMapToInitial(){
  runId++;activeWorkId=null;closePopup();clearRoute();
  setPins([{start:true,lat:WORK.lat,lng:WORK.lng}]);
  globe.pointOfView({lat:39,lng:35,altitude:2.3},1200);
  renderCard();
}

}
window.addEventListener('click',e=>{

    if(!document.getElementById(c).contains(e.target))document.getElementById(m).classList.remove('show');

});
function setSpeed(m,label,btn){
  speed=m;document.getElementById('speed-btn').innerText=`⚡ Hız: ${label}`;
  document.querySelectorAll('.speed-opt').forEach(b=>b.classList.remove('active'));btn.classList.add('active');

}
function setLanguage(l){currentLang=l;document.getElementById('lang-menu').classList.remove('show');renderCard()}
function setFontFamily(k,btn){
  let f='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif';
  if(k==='roboto')f='"Roboto",sans-serif';if(k==='playfair')f='"Playfair Display",serif';
  document.documentElement.style.setProperty('--app-font',f);
  document.querySelectorAll('.font-opt').forEach(b=>b.classList.remove('active'));btn.classList.add('active');
}
function setFontWeight(w,btn){
  document.documentElement.style.setProperty('--app-weight',w);
  document.querySelectorAll('.weight-opt').forEach(b=>b.classList.remove('active'));btn.classList.add('active');
}
function renderCard(){
  const t=translations[currentLang];
  document.getElementById('ui-title').innerText=t.title;
  document.getElementById('font-style-btn').innerText=t.fontStyle;
  document.getElementById('lbl-font').innerText=t.fontTitle;
  document.getElementById('lbl-weight').innerText=t.weightTitle;
  const list=document.getElementById('workList');list.innerHTML='';
  const card=document.createElement('div');
  card.className='work-card'+(activeWorkId===WORK.id?' highlight':'');
  card.innerHTML=`${activeWorkId===WORK.id?`<span class="active-badge">${t.activeRoute}</span>`:''}
    <h3>${t.workTitle}</h3><div class="author">${t.author}</div>
    <img src="${WORK.image}" alt="${t.workTitle}" referrerpolicy="no-referrer" onerror="this.onerror=null;this.src=FALLBACK">
    <div class="kunye-section">
      <div class="kunye-row"><span class="kunye-label">${t.period}:</span> ${t.workPeriod}</div>
      <div class="kunye-row"><span class="kunye-label">${t.center}:</span> ${t.workCenter}</div>
      <div class="kunye-row"><span class="kunye-label">${t.form}:</span> ${t.workForm}</div>
      <div class="kunye-row"><span class="kunye-label">${t.lang}:</span> ${t.workLang}</div>
      <div class="kunye-row"><span class="kunye-label">${t.purpose}:</span> ${t.workPurpose}</div>
      <div class="kunye-row"><span class="kunye-label">${t.subject}:</span> ${t.workSubject}</div>
    </div>`;
  card.addEventListener('click',()=>{startTour();card.scrollIntoView({behavior:'smooth',block:'center'})});
  list.appendChild(card);
}

fit();
renderCard();
setPins([{start:true,lat:WORK.lat,lng:WORK.lng}]);
